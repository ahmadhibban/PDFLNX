<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Engine Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); height: 100vh; display: flex; justify-content: center; align-items: center; color: #ffffff; overflow: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 40px 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 25px 45px rgba(0,0,0,0.2); transition: all 0.3s ease; }
        
        .header-icon { font-size: 55px; margin-bottom: 15px; }
        .gradient-text { background: -webkit-linear-gradient(#4facfe, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .processing-icon { color: #00f2fe; }
        .success-icon { color: #43e97b; }
        
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 5px; letter-spacing: 1px; }
        p.subtitle { font-size: 13px; color: #a8b2d1; margin-bottom: 35px; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 15px; }
        .btn:active { transform: scale(0.96); }

        .btn-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3); }
        .btn-start { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #111; box-shadow: 0 10px 20px rgba(253, 160, 133, 0.3); display: none; }
        .btn-outline { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); display: none; }

        .progress-box { display: none; margin-top: 25px; padding: 20px; background: rgba(0, 0, 0, 0.2); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00f2fe; border-radius: 50%; animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status-text { font-size: 14px; color: #a8b2d1; font-weight: 400; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- মেইন আইকন কন্টেইনার (এটি আর কখনোই লুকাবে না) -->
        <div class="header-icon" id="iconContainer">
            <i class="fa-solid fa-file-pdf gradient-text"></i>
        </div>

        <h1 id="mainTitle">PDF Processor</h1>
        <p class="subtitle" id="subTitle">Advanced Offline OCR Engine</p>
        
        <button id="selectBtn" class="btn btn-blue" onclick="pickFile()"><i class="fa-solid fa-folder-open"></i> Select PDF File</button>
        <button id="startBtn" class="btn btn-start" onclick="startJob()"><i class="fa-solid fa-rocket"></i> Start Extraction</button>
        
        <div class="progress-box" id="progressArea">
            <div class="spinner" id="spinner"></div>
            <div class="status-text" id="statusText">System Ready...</div>
        </div>

        <button id="openBtn" class="btn btn-blue" style="display: none;" onclick="openResult()"><i class="fa-solid fa-file-word"></i> Open Document</button>
        <button id="shareBtn" class="btn btn-outline" onclick="shareResult()"><i class="fa-solid fa-share-nodes"></i> Share File</button>
    </div>

    <script>
        let readyPdfPath = "";
        let finalDocPath = "";
        let isProcessingOrDone = false;

        function pickFile() { if (window.AndroidAppEngine) AndroidAppEngine.pickPdfFile(); }

        function onPdfReady(absolutePath) {
            readyPdfPath = absolutePath;
            isProcessingOrDone = true;
            document.getElementById("iconContainer").innerHTML = '<i class="fa-solid fa-file-circle-check" style="color: #f6d365;"></i>';
            document.getElementById("subTitle").innerText = "File Loaded. Ready to Process.";
            document.getElementById("selectBtn").style.display = "none";
            document.getElementById("startBtn").style.display = "flex";
        }

        function startJob() {
            document.getElementById("startBtn").style.display = "none";
            
            // 🔥 এখানে ঘূর্ণায়মান গিয়ার আইকন যোগ করা হলো 🔥
            document.getElementById("iconContainer").innerHTML = '<i class="fa-solid fa-gear fa-spin processing-icon"></i>'; 
            
            document.getElementById("progressArea").style.display = "block";
            document.getElementById("subTitle").innerText = "Engine is running in background...";
            if (window.AndroidAppEngine) AndroidAppEngine.triggerLinuxCommand(readyPdfPath);
        }

        function updateStatusFromKotlin(message) { document.getElementById("statusText").innerText = message; }

        function onJobComplete(savedPath) {
            finalDocPath = savedPath;
            document.getElementById("spinner").style.display = "none";
            document.getElementById("progressArea").style.display = "none";
            
            // সাকসেস আইকন
            document.getElementById("iconContainer").innerHTML = '<i class="fa-solid fa-circle-check success-icon"></i>';
            document.getElementById("mainTitle").innerText = "Extraction Complete!";
            document.getElementById("subTitle").innerText = "Your document is ready.";
            
            document.getElementById("openBtn").style.display = "flex";
            document.getElementById("shareBtn").style.display = "flex";
        }

        function openResult() { if (window.AndroidAppEngine) AndroidAppEngine.openFinalFile(finalDocPath); }
        function shareResult() { if (window.AndroidAppEngine) AndroidAppEngine.shareFinalFile(finalDocPath); }

        function onHardwareBackPressed() {
            if (isProcessingOrDone) {
                isProcessingOrDone = false;
                document.getElementById("iconContainer").innerHTML = '<i class="fa-solid fa-file-pdf gradient-text"></i>';
                document.getElementById("mainTitle").innerText = "PDF Processor";
                document.getElementById("subTitle").innerText = "Advanced Offline OCR Engine";
                
                document.getElementById("progressArea").style.display = "none";
                document.getElementById("openBtn").style.display = "none";
                document.getElementById("shareBtn").style.display = "none";
                document.getElementById("startBtn").style.display = "none";
                
                document.getElementById("selectBtn").style.display = "flex";
            } else {
                if (window.AndroidAppEngine) AndroidAppEngine.exitApp();
            }
        }
    </script>
</body>
</html>
