<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Engine Pro</title>
    
    <script src="tailwind.js"></script>

    <style>
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #00f2fe; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gradient-to-br from-[#0f2027] via-[#203a43] to-[#2c5364] h-screen flex justify-center items-center text-white overflow-hidden font-sans select-none">

    <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl p-10 w-[90%] max-w-[400px] text-center shadow-2xl transition-all">
        
        <div id="iconContainer" class="flex justify-center mb-4">
            <svg class="w-16 h-16 text-[#00f2fe]" fill="currentColor" viewBox="0 0 512 512"><path d="M0 64C0 28.7 28.7 0 64 0H224V128c0 17.7 14.3 32 32 32H384V304H176c-35.3 0-64 28.7-64 64V512H64c-35.3 0-64-28.7-64-64V64zm384 64H256V0L384 128zM176 352h32c30.9 0 56 25.1 56 56s-25.1 56-56 56H192v32c0 8.8-7.2 16-16 16s-16-7.2-16-16V352zm32 80c13.3 0 24-10.7 24-24s-10.7-24-24-24H192v48h16zm96-80h32c26.5 0 48 21.5 48 48v64c0 26.5-21.5 48-48 48H304c-8.8 0-16-7.2-16-16V352c0-8.8 7.2-16 16-16zm32 128c8.8 0 16-7.2 16-16V400c0-8.8-7.2-16-16-16H320v128h16zm96-128h48c8.8 0 16 7.2 16 16s-7.2 16-16 16H448v48h16c8.8 0 16 7.2 16 16s-7.2 16-16 16H448v48c0 8.8-7.2 16-16 16s-16-7.2-16-16V352c0-8.8 7.2-16 16-16z"/></svg>
        </div>

        <h1 id="mainTitle" class="text-2xl font-semibold mb-1 tracking-wide">PDF Processor</h1>
        <p id="subTitle" class="text-sm text-[#a8b2d1] mb-8">Advanced Offline OCR Engine</p>
        
        <button id="selectBtn" onclick="pickFile()" class="w-full py-4 rounded-xl font-semibold bg-gradient-to-br from-[#4facfe] to-[#00f2fe] text-white shadow-lg shadow-[#00f2fe]/30 active:scale-95 transition-all flex justify-center items-center gap-2 mb-4">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"></path></svg> Select PDF File
        </button>
        
        <button id="startBtn" onclick="startJob()" class="w-full py-4 rounded-xl font-semibold bg-gradient-to-br from-[#f6d365] to-[#fda085] text-gray-900 shadow-lg shadow-[#fda085]/30 active:scale-95 transition-all justify-center items-center gap-2 mb-4 hidden">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Start Extraction
        </button>
        
        <!-- 🔥 এখানে id="spinner" এবং mx-auto যুক্ত করা হয়েছে যাতে ক্র্যাশ না করে এবং মাঝখানে থাকে 🔥 -->
        <div id="progressArea" class="hidden mt-6 p-5 bg-black/20 rounded-2xl border border-white/5">
            <div id="spinner" class="spinner w-11 h-11 mb-4 mx-auto"></div>
            <div id="statusText" class="text-sm text-[#a8b2d1] tracking-wide">System Ready...</div>
        </div>

        <button id="openBtn" onclick="openResult()" class="w-full py-4 rounded-xl font-semibold bg-gradient-to-br from-[#4facfe] to-[#00f2fe] text-white shadow-lg shadow-[#00f2fe]/30 active:scale-95 transition-all justify-center items-center gap-2 mb-4 hidden">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> Open Document
        </button>
        
        <button id="shareBtn" onclick="shareResult()" class="w-full py-4 rounded-xl font-semibold bg-white/10 text-white border border-white/20 active:scale-95 transition-all justify-center items-center gap-2 hidden">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg> Share File
        </button>
    </div>

    <script>
        let readyPdfPath = "";
        let finalDocPath = "";
        let isProcessingOrDone = false;

        const svgPdf = `<svg class="w-16 h-16 text-[#00f2fe]" fill="currentColor" viewBox="0 0 512 512"><path d="M0 64C0 28.7 28.7 0 64 0H224V128c0 17.7 14.3 32 32 32H384V304H176c-35.3 0-64 28.7-64 64V512H64c-35.3 0-64-28.7-64-64V64zm384 64H256V0L384 128zM176 352h32c30.9 0 56 25.1 56 56s-25.1 56-56 56H192v32c0 8.8-7.2 16-16 16s-16-7.2-16-16V352zm32 80c13.3 0 24-10.7 24-24s-10.7-24-24-24H192v48h16zm96-80h32c26.5 0 48 21.5 48 48v64c0 26.5-21.5 48-48 48H304c-8.8 0-16-7.2-16-16V352c0-8.8 7.2-16 16-16zm32 128c8.8 0 16-7.2 16-16V400c0-8.8-7.2-16-16-16H320v128h16zm96-128h48c8.8 0 16 7.2 16 16s-7.2 16-16 16H448v48h16c8.8 0 16 7.2 16 16s-7.2 16-16 16H448v48c0 8.8-7.2 16-16 16s-16-7.2-16-16V352c0-8.8 7.2-16 16-16z"/></svg>`;
        const svgReady = `<svg class="w-16 h-16 text-[#f6d365]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
        const svgProcessing = `<svg class="w-16 h-16 text-[#00f2fe] animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`;
        const svgSuccess = `<svg class="w-16 h-16 text-[#43e97b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

        function pickFile() { if (window.AndroidAppEngine) AndroidAppEngine.pickPdfFile(); }

        function onPdfReady(absolutePath) {
            readyPdfPath = absolutePath;
            isProcessingOrDone = true;
            document.getElementById("iconContainer").innerHTML = svgReady;
            document.getElementById("subTitle").innerText = "File Loaded. Ready to Process.";
            document.getElementById("selectBtn").style.display = "none";
            document.getElementById("startBtn").style.display = "flex";
        }

        function startJob() {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("iconContainer").innerHTML = svgProcessing;
            document.getElementById("progressArea").style.display = "block";
            
            // স্পিনারটা আবার দৃশ্যমান করা হচ্ছে (যদি আগের কাজ থেকে হাইড হয়ে থাকে)
            document.getElementById("spinner").style.display = "block"; 
            
            document.getElementById("subTitle").innerText = "Engine is running in background...";
            if (window.AndroidAppEngine) AndroidAppEngine.triggerLinuxCommand(readyPdfPath);
        }

        function updateStatusFromKotlin(message) { document.getElementById("statusText").innerText = message; }

        function onJobComplete(savedPath) {
            finalDocPath = savedPath;
            document.getElementById("spinner").style.display = "none";
            document.getElementById("progressArea").style.display = "none";
            
            document.getElementById("iconContainer").innerHTML = svgSuccess;
            document.getElementById("mainTitle").innerText = "Extraction Complete!";
            document.getElementById("subTitle").innerText = "Your document is ready.";
            
            document.getElementById("openBtn").style.display = "flex";
            document.getElementById("shareBtn").style.display = "flex";
        }

        function openResult() { if (window.AndroidAppEngine) AndroidAppEngine.openFinalFile(finalDocPath); }
        function shareResult() { if (window.AndroidAppEngine) AndroidAppEngine.shareFinalFile(finalDocPath); }

        function onHardwareBackPressed() {
            if (isProcessingOrDone) {
                isProcessingOrDone = false;
                document.getElementById("iconContainer").innerHTML = svgPdf;
                document.getElementById("mainTitle").innerText = "PDF Processor";
                document.getElementById("subTitle").innerText = "Advanced Offline OCR Engine";
                
                document.getElementById("progressArea").style.display = "none";
                document.getElementById("openBtn").style.display = "none";
                document.getElementById("shareBtn").style.display = "none";
                document.getElementById("startBtn").style.display = "none";
                
                document.getElementById("selectBtn").style.display = "flex";
            } else {
                if (window.AndroidAppEngine) AndroidAppEngine.exitApp();
            }
        }
    </script>
</body>
</html>
